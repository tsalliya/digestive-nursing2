</style></head><body data-learning-admin="true"><main><header><a href="index.html">回到教材</a><h1>學生學習成果</h1><p>消化系統自學教材 · 單機測試版</p></header><p class="notice">這是此瀏覽器的測試資料庫，沒有登入或跨裝置同步。請使用虛構學生資料；它不是正式教師權限後台。</p><section><h2>學習摘要</h2><p>閱讀次數＝按下「開始記錄本次學習」的次數；閱讀時間僅累計分頁可見、有焦點且最近 60 秒有操作的時間，每 10 秒保存。關閉頁面可能遺失最後數秒。成績是自學測驗結果，不作為正式考試認證。</p><label for="filter">依學號或姓名篩選</label><input id="filter" type="search"><button id="refresh">重新整理</button><button id="export">匯出學習摘要 CSV</button><button id="export-attempts">匯出測驗明細 CSV</button><p id="status" role="status">載入中</p><div class="tablewrap"><table><thead><tr><th>學號</th><th>姓名</th><th>閱讀次數</th><th>閱讀時間（分鐘）</th><th>測驗次數</th><th>最近成績</th><th>最高成績</th><th>最近測驗時間</th></tr></thead><tbody id="students"></tbody></table></div></section><section><h2>歷次測驗</h2><div class="tablewrap"><table><thead><tr><th>學號</th><th>姓名</th><th>提交時間</th><th>成績</th><th>答對率</th></tr></thead><tbody id="attempts"></tbody></table></div></section><section><h2>重設測試</h2><p>先結束其他分頁的學習記錄，再清除資料。</p><button id="erase" class="danger">清除此瀏覽器的所有測試紀錄</button></section></main><script src="learning-local.js"></script><script src="admin.js"></script></body></html>
